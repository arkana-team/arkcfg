[package]
name = "arkcfg"
version = "0.1.0"
edition = "2024"
authors = ["arkanaOS Team"]
description = "System configuration tool for arkanaOS"
license = "GPL-3.0"

[[bin]]
name = "arkcfg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
thiserror = "1.0"

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
